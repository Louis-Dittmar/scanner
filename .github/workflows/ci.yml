# Fork addition: the test pipeline. Runs on every push and pull request.
#
#   core-tests          Scanner.Core unit tests (white correction, OCR parser, PDF creation) on Linux
#   ocr-service-tests   the Python AI service (server.py) with a stand-in model, on Linux and Windows
#   windows-app         builds the WinUI 3 app, packages and signs an installable MSIX, installs it on the runner
#                       and runs the FlaUI UI tests against it, including scan -> white correction -> recognition
#                       (stand-in model) -> selectable PDF
#
# The signed package is uploaded as artifact "Scanner-Paperless-x64" (with Installieren.cmd). Without the optional
# secrets SIGNING_PFX_BASE64/SIGNING_PFX_PASSWORD (subject "CN=Louis Dittmar") every run signs with a new self-signed
# certificate, which Install.ps1 trusts on installation.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Test
      run: >
        dotnet test Scanner/ScannerCoreTests/ScannerCoreTests.csproj
        --logger "trx;LogFileName=core-tests.trx"
        --logger "console;verbosity=normal"
        --results-directory TestResults

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: core-test-results
        path: TestResults

  ocr-service-tests:
    name: OCR service tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install test tools
      run: python -m pip install pytest psutil

    - name: Test
      run: python -m pytest Scanner/Scanner/OcrService/tests -v

  windows-app:
    name: Windows app (build, MSIX, UI tests)
    runs-on: windows-latest
    timeout-minutes: 75

    defaults:
      run:
        working-directory: Scanner
        shell: pwsh

    env:
      Project_Path: Scanner\Scanner.csproj
      Configuration: Release
      Platform: x64
      Package_Dir: ${{ github.workspace }}\artifacts\package\
      Results_Dir: ${{ github.workspace }}\artifacts\ui-tests

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Signing certificate
      env:
        SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
        SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
      run: |
        $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
        if ($env:SIGNING_PFX_BASE64) {
          Write-Output "Using the certificate from the repository secrets"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          $password = $env:SIGNING_PFX_PASSWORD
        }
        else {
          Write-Output "Creating a self-signed certificate for CN=Louis Dittmar"
          $password = [guid]::NewGuid().ToString()
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Louis Dittmar" -KeyUsage DigitalSignature `
            -FriendlyName "Scanner Paperless (CI)" -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}") -NotAfter (Get-Date).AddYears(2)
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
        }
        Write-Output "::add-mask::$password"
        "PFX_PATH=$pfx" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
        "PFX_PASSWORD=$password" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

    - name: Restore
      run: msbuild $env:Project_Path /t:Restore /p:Configuration=$env:Configuration /p:Platform=$env:Platform /v:minimal

    - name: Build and package
      id: build
      continue-on-error: true
      run: >
        msbuild $env:Project_Path
        /p:Configuration=$env:Configuration
        /p:Platform=$env:Platform
        /p:UapAppxPackageBuildMode=SideloadOnly
        /p:AppxBundle=Never
        /p:GenerateAppxPackageOnBuild=true
        /p:AppxPackageSigningEnabled=true
        "/p:PackageCertificateKeyFile=$env:PFX_PATH"
        "/p:PackageCertificatePassword=$env:PFX_PASSWORD"
        "/p:AppxPackageDir=$env:Package_Dir"
        /p:AppxSymbolPackageEnabled=false
        /p:SentryUploadSymbols=false
        /p:SentryUploadSources=false
        /v:minimal
        "-flp:errorsonly;logfile=$env:GITHUB_WORKSPACE\build-errors.log"

    - name: Report build errors
      if: always()
      run: |
        $logFile = "$env:GITHUB_WORKSPACE\build-errors.log"
        $errors = @()
        if (Test-Path $logFile) {
          $errors = Get-Content $logFile | Where-Object { $_.Trim() -ne "" } |
            ForEach-Object { $_ -replace [regex]::Escape("$env:GITHUB_WORKSPACE\"), "" } |
            Select-Object -Unique
        }

        if ($errors.Count -eq 0 -and "${{ steps.build.outcome }}" -eq "success") {
          "## ✅ Build succeeded" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          exit 0
        }

        if ($errors.Count -eq 0) { $errors = @("Build failed without compiler errors, see the job log.") }

        # one annotation with all errors (escaped for workflow commands)
        $text = ($errors | Select-Object -First 200) -join "`n"
        $escaped = $text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
        Write-Output "::error title=Build errors ($($errors.Count))::$escaped"

        "## ❌ Build failed ($($errors.Count) errors)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
        '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
        $text | Out-File $env:GITHUB_STEP_SUMMARY -Append
        '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
        exit 1

    - name: Add install scripts to the package
      run: |
        $testFolder = Get-ChildItem $env:Package_Dir -Directory | Where-Object { $_.Name -like "*_Test" } | Select-Object -First 1
        if (-not $testFolder) { Get-ChildItem $env:Package_Dir -Recurse | Select-Object FullName; throw "Package folder not found" }
        Copy-Item ..\tools\install\* $testFolder.FullName
        Get-ChildItem $testFolder.FullName -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
        "PACKAGE_FOLDER=$($testFolder.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: Scanner-Paperless-x64
        path: ${{ env.PACKAGE_FOLDER }}

    - name: Install the app
      run: |
        $msix = Get-ChildItem $env:PACKAGE_FOLDER -Filter *.msix | Select-Object -First 1
        $cer = Get-ChildItem $env:PACKAGE_FOLDER -Filter *.cer | Select-Object -First 1
        Import-Certificate -FilePath $cer.FullName -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
        $dependencies = @(Get-ChildItem (Join-Path $env:PACKAGE_FOLDER "Dependencies\x64") -Include *.msix, *.appx -Recurse -ErrorAction SilentlyContinue | ForEach-Object FullName)
        Write-Output "Dependencies: $($dependencies -join ', ')"
        if ($dependencies.Count -gt 0) {
          Add-AppxPackage -Path $msix.FullName -DependencyPath $dependencies -ForceApplicationShutdown
        } else {
          Add-AppxPackage -Path $msix.FullName -ForceApplicationShutdown
        }
        Get-AppxPackage LouisDittmar.ScannerPaperless | Format-List Name, Version, PackageFamilyName, InstallLocation

    - name: Build UI tests
      run: dotnet build ScannerTests\ScannerTests.csproj -c Release

    - name: Run UI tests
      run: |
        New-Item -ItemType Directory -Force $env:Results_Dir | Out-Null
        $exe = Get-ChildItem ScannerTests\bin\Release -Recurse -Filter ScannerTests.exe | Select-Object -First 1
        & $exe.FullName --results-directory $env:Results_Dir --report-trx --report-trx-filename ui-tests.trx
        if ($LASTEXITCODE -ne 0) { throw "UI tests failed with exit code $LASTEXITCODE" }

    - name: Collect app logs
      if: always()
      run: |
        $source = Join-Path $env:LOCALAPPDATA "Packages\LouisDittmar.ScannerPaperless_jdcc9wjam9c0t\LocalCache\logs"
        if (Test-Path $source) { Copy-Item $source (Join-Path $env:Results_Dir "app-logs") -Recurse -Force }

    - name: Upload UI test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-test-results
        path: ${{ env.Results_Dir }}

    - name: Remove the app and certificate
      if: always()
      run: |
        Get-AppxPackage LouisDittmar.ScannerPaperless | Remove-AppxPackage -ErrorAction SilentlyContinue
        if ($env:PFX_PATH -and (Test-Path $env:PFX_PATH)) { Remove-Item $env:PFX_PATH }

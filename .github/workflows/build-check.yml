# Fork addition: compiles the app on every push so build errors show up without a local Visual Studio build.
# Unsigned Debug build only, no packaging, no secrets. All compiler errors are collected into a single
# annotation on the check run, so they can be read through the check-runs API.

name: Build check

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: Scanner
        shell: pwsh

    env:
      Project_Path: Scanner\Scanner.csproj
      Configuration: Debug
      Platform: x64

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Restore
      run: msbuild $env:Project_Path /t:Restore /p:Configuration=$env:Configuration /p:Platform=$env:Platform /v:minimal

    - name: Build
      id: build
      continue-on-error: true
      run: >
        msbuild $env:Project_Path
        /p:Configuration=$env:Configuration
        /p:Platform=$env:Platform
        /p:AppxPackageSigningEnabled=false
        /p:GenerateAppxPackageOnBuild=false
        /v:minimal
        "-flp:errorsonly;logfile=$env:GITHUB_WORKSPACE\build-errors.log"

    - name: Report build errors
      if: always()
      run: |
        $logFile = "$env:GITHUB_WORKSPACE\build-errors.log"
        $errors = @()
        if (Test-Path $logFile) {
          $errors = Get-Content $logFile | Where-Object { $_.Trim() -ne "" } |
            ForEach-Object { $_ -replace [regex]::Escape("$env:GITHUB_WORKSPACE\"), "" } |
            Select-Object -Unique
        }

        if ($errors.Count -eq 0 -and "${{ steps.build.outcome }}" -eq "success") {
          Write-Output "Build succeeded without errors."
          "## ✅ Build succeeded" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          exit 0
        }

        if ($errors.Count -eq 0) { $errors = @("Build failed without compiler errors, see the job log.") }

        # one annotation with all errors (escaped for workflow commands)
        $text = ($errors | Select-Object -First 200) -join "`n"
        $escaped = $text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
        Write-Output "::error title=Build errors ($($errors.Count))::$escaped"

        "## ❌ Build failed ($($errors.Count) errors)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
        '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
        $text | Out-File $env:GITHUB_STEP_SUMMARY -Append
        '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
        exit 1
